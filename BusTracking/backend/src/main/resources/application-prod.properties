dtc.api.url=https://otd.delhi.gov.in/api/realtime/VehiclePositions.pb
dtc.api.key=${DTC_API_KEY}

# Railway Postgres plugin exposes PGHOST/PGPORT/PGDATABASE/PGUSER/PGPASSWORD
spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.jpa.show-sql=false

# Railway Redis plugin exposes REDIS_URL (redis://[:password@]host:port)
spring.data.redis.url=${REDIS_URL}

# Railway injects PORT; Spring binds to it directly
server.port=${PORT:8080}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Local/dev/demo import a small box around Connaught Place for fast iteration;
# prod imports the full Delhi/NCR feed (radius-degrees<=0 disables the filter)
# so real users outside central Delhi get coverage. One-time cost on first
# boot only - GtfsImportService skips re-import once routes already exist.
gtfs.import.radius-degrees=0