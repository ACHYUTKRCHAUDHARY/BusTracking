# No-infra demo profile: H2 instead of Postgres, no Docker/Kafka/Redis required.
# Run with: mvnw spring-boot:run "-Dspring-boot.run.profiles=demo"

spring.docker.compose.enabled=false

spring.datasource.url=jdbc:h2:file:./data/busdemo;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

management.health.redis.enabled=false
management.health.kafka.enabled=false

dtc.api.url=https://example.invalid/not-used-in-demo-profile
dtc.api.key=unused-in-demo-profile
