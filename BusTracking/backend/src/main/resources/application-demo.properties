# No-infra demo profile: H2 instead of Postgres, no Redis required.
# Run with: mvnw spring-boot:run "-Dspring-boot.run.profiles=demo"

spring.datasource.url=jdbc:h2:file:./data/busdemo;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

management.health.redis.enabled=false

dtc.api.url=https://otd.delhi.gov.in/api/realtime/VehiclePositions.pb
dtc.api.key=yVJB4Wv1PORP8Fabig5q47KABSlzRL0c

# 0.1 means import routes within ~11km of center, significantly speeding up startup for the demo profile
gtfs.import.radius-degrees=0.1
