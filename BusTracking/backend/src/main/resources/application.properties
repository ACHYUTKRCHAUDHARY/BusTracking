spring.application.name=bus-tracker

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=Achyut@1235
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# --- Maximum Optimizations ---
# Database Connection Pooling (HikariCP)
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# Hibernate Batch Inserts (Speeds up GTFS import and real-time event saving)
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true


# Server
server.port=8080

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
spring.profiles.active=local

# CORS - comma-separated list, overridden per-profile
cors.allowed-origins=http://localhost:3000,http://localhost:5173
dtc.poll.interval=10000
dtc.api.url=https://otd.delhi.gov.in/api/realtime/VehiclePositions.pb
dtc.api.key=yVJB4Wv1PORP8Fabig5q47KABSlzRL0c
# JWT (admin dashboard auth only - all rider-facing endpoints stay public)
jwt.secret=${JWT_SECRET:dev-only-insecure-secret-change-me-please-32-bytes-minimum}
jwt.expiration-ms=86400000
admin.default-username=${ADMIN_USERNAME:admin}
admin.default-password=${ADMIN_PASSWORD:admin123}

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html