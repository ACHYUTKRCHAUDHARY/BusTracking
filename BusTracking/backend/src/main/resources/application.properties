spring.application.name=bus-tracker

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/dtc_bus_tracker
spring.datasource.username=dtc_user
spring.datasource.password=dtc_pass
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=bus-tracker-group
spring.kafka.consumer.auto-offset-reset=earliest

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Server
server.port=8080

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
spring.profiles.active=local

# CORS - comma-separated list, overridden per-profile
cors.allowed-origins=http://localhost:3000,http://localhost:5173
dtc.poll.interval=10000
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer