spring.application.name=bus-tracker

# PostgreSQL (Neon Database Cloud / Render / Railway)
spring.datasource.url=${DATABASE_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://ep-cool-butterfly-azlojtcz.c-3.ap-southeast-1.aws.neon.tech/neondb?sslmode=require}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:neondb_owner}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:npg_wSYFBA0W6uop}
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# --- Maximum Optimizations ---
# Database Connection Pooling (HikariCP - optimized for Neon PostgreSQL)
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:2}
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

# Hibernate Batch Inserts (Speeds up GTFS import and real-time event saving)
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true


# Server
server.port=8080

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
spring.profiles.active=local

# CORS - comma-separated list, overridden per-profile or via CORS_ALLOWED_ORIGINS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,https://*.vercel.app}
dtc.poll.interval=10000
dtc.api.url=https://otd.delhi.gov.in/api/realtime/VehiclePositions.pb
dtc.api.key=yVJB4Wv1PORP8Fabig5q47KABSlzRL0c
# JWT (admin dashboard auth only - all rider-facing endpoints stay public)
jwt.secret=${JWT_SECRET:dev-only-insecure-secret-change-me-please-32-bytes-minimum}
jwt.expiration-ms=86400000
admin.default-username=${ADMIN_USERNAME:admin}
admin.default-password=${ADMIN_PASSWORD:admin123}

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Import the FULL Delhi GTFS feed instead of just a bounding box
gtfs.import.radius-degrees=0